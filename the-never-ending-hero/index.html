<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE NEVER-ENDING HERO, Arlena Marie</title>
<meta name="description" content="A quiet girl who lives in her head. The crown is where she already is. The root is where she has to arrive. Seven episodes.">
 <link rel="icon" href="/favicon.ico" sizes="48x48">
 <link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32">
 <link rel="icon" href="/images/favicon-192.png" type="image/png" sizes="192x192">
 <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/caveat-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/caveat-brush-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/nunito-latin-800.woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css?v=ce2efe8">
<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-oJ8QbaQThQoJZ7oEv+29jfPM6CcP+zUxh3PKJs1vyOhx0UraUrE7PQgeItu3dOuCJyrzWpoYMsVjkkPEBzbUqw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script>
  /* Content stays unpainted until Caveat, Caveat Brush and Nunito are ready (at most
     3 s): in a fallback font the long title and logline wrap to more lines, and the
     swap would move April's whole group up (a layout shift). */
  document.documentElement.classList.add('fonts-pending');
  Promise.race([
    Promise.all(["400 1em 'Caveat Brush'", "500 1em 'Caveat'", "800 1em 'Nunito'"].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 3000)),
  ]).finally(() => document.documentElement.classList.remove('fonts-pending'));
</script>
<script>
  /* Intro starting state: title letters, logline, points, leader lines, labels
     and card hidden until the GSAP timeline reveals them (.intro rules below).
     Skipped for reduced motion: the page starts in its final layout instead. */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');
</script>
<style>
  /* ── Episode page ──
     Desktop (720 px and up): card | April with seven points and leader lines | seven label rows.
     The stage is a fixed 360x620 figure; points sit on her center line (x 180),
     crown at y 20, then every 90 px down to root at y 560. Rows line up with
     their points. Under 720 px the columns stack and a tapped row opens its
     card inline beneath it. Per-episode highlight (0 to 1) is --h on the
     point, line and row; the page's script tweens it. */
  :root {
    --accent: #c8553d;
    --stage-w: 360px;
    --stage-h: 620px;
    --point: 22px;
    --line: 150px;
    --rows-w: 400px;   /* label column, wide enough for the longest realm row */
  }

  body {
    color: var(--ink);
    text-align: center;
    padding: 32px 16px 40px;
  }
  .content { position: relative; z-index: 1; }
  .fonts-pending .content { visibility: hidden; }   /* see the fonts-pending script in <head> */

  .page-name {
    font-family: 'Caveat Brush', cursive;
    font-weight: 400;
    font-size: clamp(40px, 10vw, 72px);
    line-height: 1.1;
    margin-bottom: 0.25rem;
  }
  /* One no-wrap group per word: the title wraps between words, never inside one */
  .page-word { display: inline-block; white-space: nowrap; }
  .logline {
    max-width: 760px;
    margin: 0 auto;
    font-size: clamp(18px, 4vw, 28px);
    line-height: 1.25;
    opacity: 0.75;
  }

  /* ── The group: card, April, rows ── */
  .ep-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 24px 40px;
    margin: 28px auto 0;
  }

  .ep-stage {
    position: relative;
    flex: none;
    width: calc(var(--stage-w) / 2 + var(--point) / 2 + var(--line) + 8px + var(--rows-w));
    height: var(--stage-h);
  }
  .ep-april {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--stage-w);
    height: var(--stage-h);
  }
  .ep-april img { display: block; width: 100%; height: 100%; }

  /* Point and leader line for one episode, on April's center line */
  .ep-mark {
    position: absolute;
    left: 50%;
    top: calc(var(--y) / 620 * 100%);
    --h: 0;
    pointer-events: none;
  }
  .ep-point {
    position: absolute;
    left: 0;
    top: 0;
    width: calc(var(--point) + 16px * var(--h));
    height: calc(var(--point) + 16px * var(--h));
    translate: -50% -50%;
    border-radius: 50%;
    background: var(--c);
    border: 2px solid var(--ink);
    box-shadow:
      0 0 0 calc(3px * var(--h)) var(--accent),
      0 0 calc(8px * var(--h)) calc(3px * var(--h)) color-mix(in srgb, var(--accent) calc(var(--h) * 55%), transparent);
    scale: var(--pop, 1);   /* intro pop; a variable, so GSAP never takes over translate */
    z-index: 2;
  }
  .ep-line {
    position: absolute;
    left: calc(var(--point) / 2);
    top: 0;
    width: var(--line);
    height: calc(1.5px + 1.5px * var(--h));
    translate: 0 -50%;
    scale: var(--draw, 1) 1;   /* intro draw, left to right */
    transform-origin: left center;
    background: color-mix(in srgb, var(--accent) calc(var(--h) * 100%), color-mix(in srgb, var(--ink) 45%, transparent));
    z-index: 1;
  }

  /* Intro starting state (html.intro; removed when the intro ends, or by
     site.js if GSAP has not arrived within 3 s) */
  .intro .logline,
  .intro .ep-row,
  .intro .ep-card { opacity: 0; }
  .intro .ep-mark { --pop: 0; --draw: 0; }

  /* Label rows: absolute on desktop, one per point */
  .ep-rows {
    position: absolute;
    left: calc(var(--stage-w) / 2 + var(--point) / 2 + var(--line) + 8px);
    top: 0;
    width: var(--rows-w);
    height: 100%;
    text-align: left;
  }
  .ep-row {
    --h: 0;
    position: absolute;
    left: 0;
    top: calc(var(--y) / 620 * 100%);
    translate: 0 -50%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    font: inherit;
    color: inherit;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
    border: 2px solid color-mix(in srgb, var(--ink) calc(var(--h) * 100%), transparent);
    border-radius: 12px;
    background: color-mix(in srgb, #fff calc(var(--h) * 100%), transparent);
  }
  .ep-row:focus-visible { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .ep-dot { display: none; }
  /* Row label: "1 · The Overlook Forest" (number, then the realm) */
  .ep-label {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }
  .ep-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.12em;
  }
  .ep-name {
    font-family: 'Caveat', cursive;
    font-weight: 500;
    font-size: 30px;
    line-height: 1;
  }
  .ep-chip {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--chip, transparent);
  }
  .ep-panel { display: none; }

  /* ── Card: one face per episode, stacked; the shown face has opacity 1 ── */
  .ep-card {
    position: relative;
    flex: none;
    width: 300px;
    height: 270px;   /* fits the tallest face: episode 1 with its progress bar */
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 18px;
    text-align: left;
  }
  .ep-face {
    position: absolute;
    inset: 14px;
    opacity: 0;
  }
  .ep-face.shown { opacity: 1; }
  .ep-panel .ep-face { position: static; opacity: 1; }
  .ep-key-frame {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    object-fit: cover;
  }
  .ep-key-frame.empty {
    display: grid;
    place-items: center;
    border: 2px dashed color-mix(in srgb, var(--ink) 40%, transparent);
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .ep-meta {
    margin-top: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .ep-realm {
    margin-top: 4px;
    font-family: 'Caveat', cursive;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.1;
  }
  .ep-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 10px;
  }
  .ep-progress-bar {
    flex: 1;
    height: 12px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
  }
  .ep-progress-fill { height: 100%; background: #f5d985; }

  /* ── Below the group ── */
  .ep-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px 28px;
    margin-top: 18px;
  }
  .back {
    font-size: clamp(16px, 3vw, 20px);
    color: var(--ink);
    text-decoration: none;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .back:hover { opacity: 1; }
  .pill {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    padding: 7px 16px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: #fff;
  }
  .pill:hover { background: #f4b6c2; }
  .ep-error { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; }

  /* ── Phone: stack April, then the rows; tap a row to open its card inline ── */
  @media (max-width: 719px) {
    .ep-group { flex-direction: column; gap: 20px; }
    .ep-card { display: none; }
    .ep-stage { width: 100%; height: auto; }
    .ep-april {
      position: relative;
      width: min(var(--stage-w), 100%);
      height: auto;
      aspect-ratio: 360 / 620;
      margin: 0 auto;
    }
    .ep-line { display: none; }
    .ep-rows {
      position: static;
      width: min(440px, 100%);
      height: auto;
      min-height: calc(7 * 72px);   /* reserved before episodes.json arrives (7 rows of 66 + 6) */
      margin: 20px auto 0;
    }
    /* Same grid for every row: dot | label (may wrap to two lines) | chip */
    .ep-row {
      position: relative;
      top: auto;
      translate: none;
      width: 100%;
      height: 66px;
      margin-bottom: 6px;
      display: grid;
      grid-template-columns: 16px 1fr auto;
      grid-template-areas: "dot label chip";
      align-items: center;
      gap: 12px;
      white-space: normal;
    }
    .ep-dot {
      grid-area: dot;
      align-self: center;
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: var(--c);
    }
    .ep-label { grid-area: label; display: block; min-width: 0; }
    .ep-num { margin-right: 6px; }
    .ep-name { font-size: 26px; }
    .ep-chip { grid-area: chip; }
    .ep-panel {
      margin: 0 0 12px;
      padding: 14px;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 18px;
      text-align: left;
    }
    .ep-panel.open { display: block; }
  }
</style>
</head>
<body>
<main>

<div class="orbit-anchor"><div class="orbit-ring" id="orbitRing"></div></div>

<div class="content">
  <h1 class="page-name" id="pageName" aria-label="The Never-Ending Hero"></h1>
  <p class="logline">A quiet girl who lives in her head. The crown is where she already is. The root is where she has to arrive.</p>

  <div class="ep-group" id="epGroup">
    <section class="ep-card" id="epCard" aria-live="polite" aria-label="Episode"></section>
    <div class="ep-stage">
      <div class="ep-april" id="epApril">
        <img src="/images/april-placeholder.svg" width="360" height="620" alt="">
      </div>
      <div class="ep-rows" id="epRows"></div>
    </div>
  </div>

  <div class="ep-foot">
    <a href="/" class="back">← back home</a>
    <a href="/about" class="pill">contact</a>
  </div>
</div>

</main>

<script src="/assets/site.js?v=1839412"></script>
<script>
/* ── Page config: The Never-Ending Hero ── */
/* Letters are animated by GSAP below (intro, then idle wiggle), as on the homepage.
   Each word is its own no-wrap group, so a narrow screen wraps between words. */
{
  const name = document.getElementById('pageName');
  'THE NEVER-ENDING HERO'.split(' ').forEach((word, i) => {
    if (i) name.append(' ');
    const w = document.createElement('span');
    w.className = 'page-word';
    name.append(w);
    Site.title(w, word, { driver: 'gsap' });
  });
}

/* 8 stars, ellipse 35% of the shorter viewport side by 85% of that, sized 14 to 36 px */
const r = Math.min(window.innerWidth, window.innerHeight) * 0.35;
Site.orbit(document.getElementById('orbitRing'), {
  count: 8,
  duration: '55s',
  position: 'fixed',
  z: 0,
  item: i => {
    const sz = 14 + ((i * 37) % 100) / 100 * 22;
    return { sz, node: Site.star(sz, Site.palette.stars[i % 6]) };
  },
  radius: () => ({ rx: r, ry: r * 0.85 }),
  relayout: false,
});

/* ── Episodes ──
   Rendered from episodes.json at load. Points run crown (1, top) to root (7),
   90 px apart on April's center line, in these colors. */
const COLORS = ['#d4c5e8', '#c9b8e6', '#a8d8ea', '#b8e0d2', '#f5d985', '#f5a896', '#f4b6c2'];
const FIRST_Y = 20, STEP_Y = 90;          // px in the 360x620 figure
const DEFAULT_EP = 1;                     // shown in the card on load (the one in the works)
const STATUS = {
  'finished':       { label: 'Finished',       fill: '#b8e0d2' },
  'in-the-works':   { label: 'In the works',   fill: '#f5d985' },
  'next-up':        { label: 'Next up',        fill: '#f4b6c2' },
  'on-the-horizon': { label: 'On the horizon', fill: 'transparent' },
};

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

// One card face: keyframe (or a dashed placeholder), "EPISODE N · STATUS", the realm, progress.
// chakra, title and line stay in episodes.json but are not shown (they can come back later).
function face(ep) {
  const f = el('div', 'ep-face');
  if (ep.keyframe) {
    const img = el('img', 'ep-key-frame');
    img.src = ep.keyframe;
    img.alt = `Episode ${ep.n} keyframe`;
    f.append(img);
  } else {
    f.append(el('div', 'ep-key-frame empty', 'keyframe soon'));
  }
  f.append(el('p', 'ep-meta', `Episode ${ep.n} · ${STATUS[ep.status].label}`));
  if (ep.realm) f.append(el('p', 'ep-realm', ep.realm));
  if (ep.progress != null) {
    const p = el('div', 'ep-progress');
    const bar = el('div', 'ep-progress-bar');
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-valuenow', ep.progress);
    bar.setAttribute('aria-valuemin', 0);
    bar.setAttribute('aria-valuemax', 100);
    bar.setAttribute('aria-label', `Episode ${ep.n} progress`);
    const fill = el('div', 'ep-progress-fill');
    fill.style.width = `${ep.progress}%`;
    bar.append(fill);
    p.append(bar, el('span', '', `${ep.progress}%`));
    f.append(p);
  }
  return f;
}

function render(episodes) {
  const april = document.getElementById('epApril');
  const rows = document.getElementById('epRows');
  const card = document.getElementById('epCard');
  const out = {};
  episodes.forEach(ep => {
    const y = FIRST_Y + (ep.n - 1) * STEP_Y;
    const c = COLORS[ep.n - 1];

    const mark = el('div', 'ep-mark');
    mark.setAttribute('aria-hidden', 'true');
    mark.style.setProperty('--y', y);
    mark.style.setProperty('--c', c);
    const point = el('span', 'ep-point');
    const line = el('span', 'ep-line');
    mark.append(line, point);
    april.append(mark);

    const row = el('button', 'ep-row');
    row.type = 'button';
    row.dataset.n = ep.n;
    row.style.setProperty('--y', y);
    row.style.setProperty('--c', c);
    const chip = el('span', 'ep-chip', STATUS[ep.status].label);
    chip.style.setProperty('--chip', STATUS[ep.status].fill);
    const label = el('span', 'ep-label');
    label.append(el('span', 'ep-num', `${ep.n} ·`), el('span', 'ep-name', ep.realm));
    row.append(el('span', 'ep-dot'), label, chip);
    row.setAttribute('aria-controls', `ep-panel-${ep.n}`);

    const panel = el('div', 'ep-panel');
    panel.id = `ep-panel-${ep.n}`;
    panel.append(face(ep));
    rows.append(row, panel);

    const f = face(ep);
    if (ep.n === DEFAULT_EP) f.classList.add('shown');
    card.append(f);

    out[ep.n] = { ep, mark, point, line, row, panel, face: f };
  });
  return out;
}

const episodes = fetch('episodes.json')
  .then(res => { if (!res.ok) throw new Error(`episodes.json: ${res.status}`); return res.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('epRows').append(el('p', 'ep-error', 'The episodes did not load. Please refresh.'));
    return null;
  });

/* ── Interaction ──
   Desktop (720 px and up, side card): hovering a row, or reaching it with the
   keyboard, lights its point, line and label (--h to 1) and cross-fades the
   card to that episode in 0.25 s; leaving returns to episode 4 with nothing
   lit. A touch tap on the desktop layout picks a row until another is picked.
   Phone (under 720 px): no hover; tapping a row opens its card inline beneath
   it (one open at a time) and lights its point.
   Every event recomputes the whole state and retargets one quickTo per value,
   as Site.hover does, so rapid moves can never leave anything half lit.
   Without gsap the same values are set instantly. */
const phone = matchMedia('(max-width: 719px)');

episodes.then(items => {
  if (!items) return;
  const eps = Object.values(items);
  let hovered = null, focused = null, picked = null, open = null, lastType = '';

  const quick = new Map();
  const to = (target, prop, value) => {
    const gsap = window.gsap;
    if (!gsap) { target.style.setProperty(prop, value); return; }
    const key = quick.get(target) || {};
    if (!key[prop]) {
      gsap.set(target, { [prop]: getComputedStyle(target).getPropertyValue(prop) || 0 });
      key[prop] = gsap.quickTo(target, prop, { duration: 0.25, ease: 'power2.out' });
      quick.set(target, key);
    }
    key[prop](value);
  };

  const apply = () => {
    const desk = !phone.matches;
    const lit = desk ? (hovered ?? focused ?? picked) : open;
    const shown = lit ?? DEFAULT_EP;
    eps.forEach(({ ep, mark, row, panel, face }) => {
      const h = ep.n === lit ? 1 : 0;
      to(mark, '--h', h);
      to(row, '--h', h);
      to(face, 'opacity', ep.n === shown ? 1 : 0);
      panel.classList.toggle('open', !desk && ep.n === open);
      if (desk) { row.removeAttribute('aria-expanded'); row.setAttribute('aria-controls', 'epCard'); }
      else { row.setAttribute('aria-expanded', String(ep.n === open)); row.setAttribute('aria-controls', panel.id); }
    });
  };

  eps.forEach(({ ep, row }) => {
    const n = ep.n;
    row.addEventListener('pointerdown', e => { lastType = e.pointerType; });
    row.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') { hovered = n; apply(); } });
    row.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch' && hovered === n) { hovered = null; apply(); } });
    row.addEventListener('pointercancel', () => { if (hovered === n) { hovered = null; apply(); } });
    row.addEventListener('focus', () => { if (row.matches(':focus-visible')) { focused = n; apply(); } });
    row.addEventListener('blur', () => { if (focused === n) { focused = null; apply(); } });
    row.addEventListener('click', e => {
      if (phone.matches) { open = open === n ? null : n; apply(); return; }
      if ((e.pointerType || lastType) === 'touch') { picked = picked === n ? null : n; apply(); }
    });
  });

  // The card faces start from their class; from here on the tweens own opacity
  eps.forEach(({ face }) => { face.style.opacity = face.classList.contains('shown') ? 1 : 0; face.classList.remove('shown'); });
  phone.addEventListener('change', () => { hovered = focused = picked = open = null; apply(); });
  // Back/forward cache restores the page as it was left; the pointer has moved since
  window.addEventListener('pageshow', e => { if (e.persisted) { hovered = picked = null; apply(); } });
  apply();
});

/* ── Intro and idle motion ──
   Title letters and logline as on the homepage; then the seven points pop in
   crown to root (0.06 s stagger, back.out); then the leader lines draw left to
   right; then the labels and the card fade in. The timeline waits for
   episodes.json. Reduced motion drops the intro only (html.intro is never
   set): the page starts in its final layout, and the letter wiggle, hover and
   tap still run. */
Site.motion((gsap, { intro }) => {
  const letters = gsap.utils.toArray('#pageName .wiggle-letter');
  const ease = 'back.out(1.7)';

  // Idle wiggle: -5deg to 5deg and up 3 px and back, 2.4 s per cycle
  // Registered with Site.loop so a back/forward cache restore can resume it
  const wiggle = el => Site.loop(gsap.fromTo(el, { rotation: -5, y: 0 },
    { rotation: 5, y: -3, duration: 1.2, ease: 'sine.inOut', repeat: -1, yoyo: true }));

  if (!intro) { letters.forEach(wiggle); return; }

  // Registered with Site.intro so a back/forward cache restore finishes it instead of replaying
  const tl = Site.intro(gsap.timeline({ onComplete: () => document.documentElement.classList.remove('intro') }));
  tl.fromTo(letters, { opacity: 0, y: 18, scale: 0.7, rotation: -5 }, {
      opacity: 1, y: 0, scale: 1, rotation: -5, duration: 0.5, ease,
      stagger: { each: 0.08, onComplete() { wiggle(this.targets()[0]); } },
    }, 0)
    .fromTo('.logline', { opacity: 0 }, { opacity: 0.75, duration: 0.5 }, 0.3);

  episodes.then(items => {
    // No data, or it came after the title finished: the page is already in its final layout
    if (!items || tl.progress() === 1) return;
    const eps = Object.values(items).sort((a, b) => a.ep.n - b.ep.n);   // crown to root
    const marks = eps.map(e => e.mark);
    tl.fromTo(marks, { '--pop': 0 }, { '--pop': 1, duration: 0.45, ease, stagger: 0.06 }, 0.9)
      .fromTo(marks, { '--draw': 0 }, { '--draw': 1, duration: 0.35, ease: 'power2.out', stagger: 0.06 }, '>-0.1')
      .fromTo([...eps.map(e => e.row), '#epCard'], { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.06 }, '>-0.15');
  });
});
</script>
</body>
</html>
