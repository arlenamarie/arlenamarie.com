 <link rel="icon" href="/favicon.ico" sizes="48x48">
 <link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32">
 <link rel="icon" href="/images/favicon-192.png" type="image/png" sizes="192x192">
 <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/caveat-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/caveat-brush-latin.woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" integrity="sha512-oJ8QbaQThQoJZ7oEv+29jfPM6CcP+zUxh3PKJs1vyOhx0UraUrE7PQgeItu3dOuCJyrzWpoYMsVjkkPEBzbUqw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script>
  /* Intro starting state: stars and letters hidden, tiles at half size (site.css .intro).
     Skipped for reduced motion: the page starts in its final layout instead. */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro');
</script>
<style>
  html, body { overflow: hidden; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── The whole composition lives in one square that scales with the viewport ── */
  .world {
    position: relative;
    width: min(92vw, 92vh);
    height: min(92vw, 92vh);
    max-width: 960px;
    max-height: 960px;
  }

  /* ── Wiggling Name ── */
  .name-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
    user-select: none;
  }

  .name-row {
    display: flex;
    justify-content: center;
    gap: 0.02em;
    font-family: 'Caveat Brush', cursive;
    font-size: clamp(40px, 10vmin, 96px);
    color: var(--ink);
    line-height: 1.05;
  }

  .name-row + .name-row { margin-top: 0.02em; }

  @media (max-width: 480px) {
    .name-row { font-size: clamp(32px, 13vw, 56px); }
  }

  @media (max-height: 480px) {
    .world { width: 90vh; height: 90vh; }
  }
</style>
</head>
<body>
<main>

<div class="world">

  <!-- ═══ STAR ORBIT ═══ -->
  <div class="orbit-world" id="orbitWorld"></div>

  <!-- ═══ WIGGLING NAME ═══ -->
  <div class="name-wrap">
    <div class="name-row" id="nameRow1"></div>
    <div class="name-row" id="nameRow2"></div>
  </div>

  <!-- ═══ FOLLOW, top center ═══ -->
  <a href="/socials" class="tile pos-t cx">
    <div class="tile-body">
      <div class="tile-img">
        <picture><source srcset="images/Socials_Follow_1.webp" type="image/webp"><img src="images/Socials_Follow_1.png" class="idle" alt="Follow"></picture>
        <picture><source srcset="images/Socials_Follow_2.webp" type="image/webp"><img src="images/Socials_Follow_2.png" class="hover" alt="Follow"></picture>
      </div>
      <span class="tile-label">Follow</span>
    </div>
  </a>

  <!-- ═══ BAR ART, left upper ═══ -->
  <a href="/bar-art" class="tile pos-lu">
    <div class="tile-body">
      <div class="tile-img">
        <picture><source srcset="images/Lucille_1.webp" type="image/webp"><img src="images/Lucille_1.png" class="idle" alt="Bar Art"></picture>
        <picture><source srcset="images/Lucille_2.webp" type="image/webp"><img src="images/Lucille_2.png" class="hover" alt="Bar Art"></picture>
      </div>
      <span class="tile-label">Bar Art</span>
    </div>
  </a>

  <!-- ═══ PODCAST, right upper ═══ -->
  <a href="/drinks-at-the-bar" class="tile pos-ru">
    <div class="tile-body">
      <div class="tile-img">
        <picture><source srcset="images/Drinks_at_the_Bar_1.webp" type="image/webp"><img src="images/Drinks_at_the_Bar_1.png" class="idle" alt="Podcast"></picture>
        <picture><source srcset="images/Drinks_at_the_Bar_2.webp" type="image/webp"><img src="images/Drinks_at_the_Bar_2.png" class="hover" alt="Podcast"></picture>
      </div>
      <span class="tile-label">Podcast</span>
    </div>
  </a>

  <!-- ═══ ABOUT, left lower ═══ -->
  <a href="/about" class="tile pos-ll">
    <div class="tile-body">
      <div class="tile-img">
        <picture><source srcset="images/About_Contact_1.webp" type="image/webp"><img src="images/About_Contact_1.png" class="idle" alt="About"></picture>
        <picture><source srcset="images/About_Contact_2.webp" type="image/webp"><img src="images/About_Contact_2.png" class="hover" alt="About"></picture>
      </div>
      <span class="tile-label">About</span>
    </div>
  </a>

  <!-- ═══ THE HERO, right lower ═══ -->
  <a href="/the-never-ending-hero" class="tile pos-rl">
    <div class="tile-body">
      <div class="tile-img">
        <picture><source srcset="images/Inti_1.webp" type="image/webp"><img src="images/Inti_1.png" class="idle" alt="The Hero"></picture>
        <picture><source srcset="images/Inti_2.webp" type="image/webp"><img src="images/Inti_2.png" class="hover" alt="The Hero"></picture>
      </div>
      <span class="tile-label">The Hero</span>
    </div>
  </a>

  <!-- ═══ PUPPET GARBAGE, bottom center ═══ -->
  <a href="/puppet-garbage" class="tile pos-b cx">
    <div class="tile-body">
      <div class="tile-img">
        <picture><source srcset="images/Puppet_Garbage_1.webp" type="image/webp"><img src="images/Puppet_Garbage_1.png" class="idle" alt="Puppet Garbage"></picture>
        <picture><source srcset="images/Puppet_Garbage_2.webp" type="image/webp"><img src="images/Puppet_Garbage_2.png" class="hover" alt="Puppet Garbage"></picture>
      </div>
      <span class="tile-label">Puppet Garbage</span>
    </div>
  </a>

</div>

</main>

<script src="/assets/site.js"></script>
<script>
/* ── Page config: homepage ── */
/* Letters are animated by GSAP below (intro, then idle wiggle) */
const title = { driver: 'gsap', space: { width: '0.35em' } };
Site.title(document.getElementById('nameRow1'), 'ARLENA', title);
Site.title(document.getElementById('nameRow2'), 'MARIE', title);

/* 12 stars on an ellipse at 48% x 46% of the .world square, sized 16 to 40 px,
   one turn every 50 s. Static at these positions until their orbit starts. */
const orbit = Site.worldOrbit(document.getElementById('orbitWorld'), {
  count: 12, rx: 48, ry: 46, duration: 50,
  item: i => Site.star(16 + ((i * 37) % 100) / 100 * (40 - 16), Site.palette.stars[i % 6]),
});

/* ── Intro and idle motion ──
   Choreography board timings: stars 0 s, letters 0.6 s, tiles 1.5 s, all back.out(1.7).
   Each star starts orbiting and each letter starts wiggling as it lands.
   Reduced motion drops only the transitions: no intro (html.intro is never
   set, so intro is false here) and no view transition (site.css). The
   ambient loops still run, starting from the final layout: orbit, wiggle
   and hover. */
Site.motion((gsap, { intro }) => {
  document.querySelectorAll('.world .tile').forEach(t => Site.hover(t));

  const letters = gsap.utils.toArray('.name-wrap .wiggle-letter');
  const tiles = gsap.utils.toArray('.world .tile-body');  // never .tile itself (see site.css)
  const ease = 'back.out(1.7)';

  // Idle wiggle: -5deg to 5deg and up 4 px and back, 2.4 s per cycle
  // Registered with Site.loop so a back/forward cache restore can resume it
  const wiggle = el => Site.loop(gsap.fromTo(el, { rotation: -5, y: 0 },
    { rotation: 5, y: -4, duration: 1.2, ease: 'sine.inOut', repeat: -1, yoyo: true }));

  if (!intro) {
    orbit.items.forEach((_, i) => orbit.start(i));
    letters.forEach(wiggle);
    return;
  }

  // Registered with Site.intro so a back/forward cache restore finishes it instead of replaying
  Site.intro(gsap.timeline({ onComplete: () => document.documentElement.classList.remove('intro') }))
    .fromTo(orbit.items, { opacity: 0, scale: 0.4 }, {
      opacity: 1, scale: 1, duration: 0.7, ease,
      stagger: { each: 0.05, onComplete() { orbit.start(orbit.items.indexOf(this.targets()[0])); } },
    }, 0)
    .fromTo(letters, { opacity: 0, y: 18, scale: 0.7, rotation: -5 }, {
      opacity: 1, y: 0, scale: 1, rotation: -5, duration: 0.5, ease,
      stagger: { each: 0.08, onComplete() { wiggle(this.targets()[0]); } },
    }, 0.6)
    .fromTo(tiles, { scale: 0.5 }, {
      scale: 1, duration: 0.55, ease, stagger: 0.12,
    }, 1.5);
});
</script>
</body>
</html>
