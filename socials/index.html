<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Follow — Arlena Marie</title>
 <link rel="icon" href="/favicon.ico" sizes="48x48">
 <link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32">
 <link rel="icon" href="/images/favicon-192.png" type="image/png" sizes="192x192">
 <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  :root { --page-bg: #f9e4e8; }

  html, body { overflow: hidden; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ── Center content ── */
  .center-content {
    position: relative;
    z-index: 10;
    text-align: center;
    pointer-events: none;
    user-select: none;
  }

  /* ── Glowing Name ── */
  .glow-row {
    display: flex;
    justify-content: center;
    gap: 0.03em;
    font-family: 'Caveat Brush', cursive;
    font-size: clamp(48px, 12vmin, 96px);
    color: var(--ink);
    line-height: 1;
  }

  .tagline {
    font-size: clamp(18px, 4vmin, 28px);
    color: var(--ink);
    opacity: 0.65;
    margin-top: 12px;
  }

  /* ── Floating social icons ── */
  .floater {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .floater:hover {
    transform: scale(1.25);
  }

  .floater-icon {
    width: clamp(50px, 10vmin, 90px);
    height: clamp(50px, 10vmin, 90px);
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.12));
  }

  .floater-handle {
    margin-top: 4px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(11px, 2vmin, 16px);
    color: var(--ink);
    white-space: nowrap;
    opacity: 0.85;
  }

  /* Drift wrappers — each icon drifts on its own path */
  .floater-drift {
    position: fixed;
    z-index: 20;
  }

  /* Pause ALL animation on hover so you can catch it */
  .floater-drift:hover {
    animation-play-state: paused !important;
  }

  /* Each icon gets unique X and Y animations with mismatched durations
     to create lissajous-like organic non-repeating paths */

  .drift-1 {
    animation: dX1 21s ease-in-out infinite alternate, dY1 27s ease-in-out infinite alternate;
  }
  .drift-2 {
    animation: dX2 25s ease-in-out infinite alternate, dY2 19s ease-in-out infinite alternate;
  }
  .drift-3 {
    animation: dX3 29s ease-in-out infinite alternate, dY3 22s ease-in-out infinite alternate;
  }
  .drift-4 {
    animation: dX4 20s ease-in-out infinite alternate, dY4 28s ease-in-out infinite alternate;
  }

  @keyframes dX1 { 0% { left: 5%;  } 100% { left: 70%; } }
  @keyframes dY1 { 0% { top: 8%;   } 100% { top: 65%; } }

  @keyframes dX2 { 0% { left: 68%; } 100% { left: 8%;  } }
  @keyframes dY2 { 0% { top: 55%;  } 100% { top: 10%; } }

  @keyframes dX3 { 0% { left: 10%; } 100% { left: 60%; } }
  @keyframes dY3 { 0% { top: 60%;  } 100% { top: 18%; } }

  @keyframes dX4 { 0% { left: 55%; } 100% { left: 3%;  } }
  @keyframes dY4 { 0% { top: 5%;   } 100% { top: 72%; } }

  /* ── Mobile ── */
  @media (max-width: 480px) {
    .floater-icon {
      width: clamp(45px, 14vw, 70px);
      height: clamp(45px, 14vw, 70px);
    }
    .glow-row { font-size: clamp(40px, 14vw, 72px); }
  }
 .drift-5 {
  animation: dX5 23s ease-in-out infinite alternate, dY5 18s ease-in-out infinite alternate;
}
@keyframes dX5 { 0% { left: 45%; } 100% { left: 6%; } }
@keyframes dY5 { 0% { top: 10%; } 100% { top: 70%; } }
</style>
</head>
<body>

  <!-- ═══ HEART ORBIT ═══ -->
  <div class="orbit-anchor">
    <div class="orbit-ring" id="orbitRing"></div>
  </div>

  <!-- ═══ CENTER: GLOWING NAME + TAGLINE ═══ -->
  <div class="center-content">
    <div class="glow-row" id="glowName"></div>
    <p class="tagline">find me everywhere</p>
  </div>

  <!-- ═══ FLOATING SOCIAL ICONS ═══ -->

  <div class="floater-drift drift-1">
    <a href="https://instagram.com/arlenamarie" target="_blank" rel="noopener" class="floater">
      <picture><source srcset="/images/instagram_1.webp" type="image/webp"><img src="/images/instagram_1.png" class="floater-icon" alt="Instagram"></picture>
      <span class="floater-handle">@arlenamarie</span>
    </a>
  </div>

  <div class="floater-drift drift-2">
    <a href="https://instagram.com/puppetgarbage" target="_blank" rel="noopener" class="floater">
      <picture><source srcset="/images/instagram_1.webp" type="image/webp"><img src="/images/instagram_1.png" class="floater-icon" alt="Instagram"></picture>
      <span class="floater-handle">@puppetgarbage</span>
    </a>
  </div>

  <div class="floater-drift drift-3">
    <a href="https://instagram.com/theneverendinghero" target="_blank" rel="noopener" class="floater">
      <picture><source srcset="/images/instagram_1.webp" type="image/webp"><img src="/images/instagram_1.png" class="floater-icon" alt="Instagram"></picture>
      <span class="floater-handle">@theneverendinghero</span>
    </a>
  </div>

  <div class="floater-drift drift-4">
    <a href="https://youtube.com/@arlena-marie" target="_blank" rel="noopener" class="floater">
      <picture><source srcset="/images/youtube_1.webp" type="image/webp"><img src="/images/youtube_1.png" class="floater-icon" alt="YouTube"></picture>
      <span class="floater-handle">@arlena-marie</span>
    </a>
  </div>
  <div class="floater-drift drift-5">
  <a href="/onlyfans" class="floater">
    <picture><source srcset="/images/onlyfans_1.webp" type="image/webp"><img src="/images/onlyfans_1.png" class="floater-icon" alt="Only Fans"></picture>
    <span class="floater-handle">only fans</span>
  </a>
</div>

  <!-- ═══ BACK LINK ═══ -->
  <a href="/" class="back-link">&larr; back home</a>

<script src="/assets/site.js"></script>
<script>
/* ── Page config: socials ── */
Site.title(document.getElementById('glowName'), 'FOLLOW', {
  step: 0.15, rot: '4deg', lift: '3px', spd: '3s',
  glow: '#ff6b9d', glowFaint: '#ff6b9d55',
});

/* 10 hearts, ellipse 35% of the shorter viewport side by 80% of that, sized 14 to 40 px.
   Positions are set once at load (no resize relayout), as before. */
const heartColors = ['#ff6b9d','#f4b6c2','#ffb3c6','#c9184a','#ffccd5','#ff8fab'];

function heartSVG(sz, fill) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', sz); svg.setAttribute('height', sz);
  svg.setAttribute('viewBox', '0 0 100 100');
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', 'M50,82 C50,82 15,60 15,35 C15,22 25,15 35,15 C42,15 47,18 50,25 C53,18 58,15 65,15 C75,15 85,22 85,35 C85,60 50,82 50,82 Z');
  path.setAttribute('fill', fill);
  path.setAttribute('stroke', Site.palette.ink);
  path.setAttribute('stroke-width', 2.5);
  path.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(path);
  return svg;
}

const r = Math.min(window.innerWidth, window.innerHeight) * 0.35;
Site.orbit(document.getElementById('orbitRing'), {
  count: 10,
  duration: '55s',
  position: 'fixed',
  z: 1,
  item: i => {
    const sz = 14 + ((i * 37) % 100) / 100 * 26;
    return { sz, node: heartSVG(sz, heartColors[i % heartColors.length]) };
  },
  radius: () => ({ rx: r, ry: r * 0.8 }),
  relayout: false,
});
</script>
</body>
</html>
